<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seu Filme</title>

    <link rel="stylesheet" href="./css/style.css">
   

</head>
<body>

   <header>

        <div>
            Logo do site
        </div>

        <nav>
            <ul>
                <a href="index.html"><li>Início</li></a>
                <a href="#"><li>Trending</li></a>
                <a href="#"><li>Categorias</li></a>
                <a href="#"><li>Sobre</li></a>
            </ul>
        </nav>

        <div>
            <input type="text" placeholder="Digite o nome do filme" class="input-header">
        </div>

   </header>

   <section class="sec-carousel">    
        <div class="carousel">
                <div class="slides">
                    <div class="slide"><img src="./imagens/stranger3.jpg" alt="Slide 1"></div>
                    <div class="slide"><img src="./imagens/diversos3.jpg" alt="Slide 2"></div>
                    <div class="slide"><img src="./imagens/diversos4.jpg" alt="Slide 3"></div>
                </div>

                <button id="prev" class="ctrl"><</button>
                <button id="next" class="ctrl">></button>

                <div class="dots" aria-hidden="true"></div>
            </div>
   </section>

   <main>

        <div class="fil-rec"> 
            <div class="fil-tit"> Filmes recomendados </div>
            <div class="fil-list">
                <nav>
                    <ul>
                        <a href="#"><li>Ação</li></a>
                        <a href="#"><li>Comédia</li></a>
                        <a href="#"><li>Ficção</li></a>
                        <a href="#"><li>Documentário</li></a>
                    </ul>
                </nav>
            </div>
        </div>

        <section class="filmes">

            

            <div class="rec card1"></div>
            <div class="rec card2"></div>
            <div class="rec card3"></div>
            <div class="rec card4"></div>
            <div class="rec card5"></div>
            <div class="rec card5"></div>


           

        </section>
   </main>


    <script src="script.js"></script>
    <script src="carrosel.js"></script>
